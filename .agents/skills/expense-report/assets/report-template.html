<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{{REPORT_TITLE}}</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #667085;
      --line: #e4e8ef;
      --surface: #ffffff;
      --page: #f4f6fa;
      --brand: #2457d6;
      --expense: #d64b57;
      --income: #14845b;
      --shadow: 0 12px 32px rgb(20 35 70 / 7%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--page); color: var(--ink); line-height: 1.55; }
    main { width: min(1120px, calc(100% - 32px)); margin: 36px auto; }
    header { display: flex; justify-content: space-between; gap: 24px; align-items: flex-end; margin-bottom: 24px; }
    h1, h2, p { margin-top: 0; }
    h1 { margin-bottom: 4px; font-size: clamp(1.7rem, 4vw, 2.35rem); letter-spacing: -.035em; }
    h2 { font-size: 1.12rem; margin-bottom: 16px; }
    .eyebrow, .muted, .meta { color: var(--muted); }
    .eyebrow { margin-bottom: 6px; font-size: .78rem; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    .meta { text-align: right; font-size: .88rem; }
    .currency-section { margin-top: 18px; }
    .currency-section > h2 { font-size: 1.35rem; margin: 0 0 14px; }
    .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-bottom: 18px; }
    .card, section { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }
    .card { padding: 18px 20px; }
    .card-label { color: var(--muted); font-size: .88rem; }
    .card-value { margin: 6px 0 0; font-size: clamp(1.25rem, 3vw, 1.8rem); font-weight: 750; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
    .expense { color: var(--expense); }
    .income { color: var(--income); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 18px; }
    section { min-width: 0; padding: 20px; margin-bottom: 18px; }
    .grid section { margin-bottom: 0; }
    .chart { width: 100%; min-height: 180px; overflow: auto; }
    .chart svg { display: block; max-width: 100%; height: auto; margin: 0 auto; }
    .insights { padding-left: 20px; margin-bottom: 0; }
    .insights li + li { margin-top: 8px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .91rem; }
    th, td { padding: 11px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    th { color: var(--muted); font-size: .78rem; letter-spacing: .04em; text-transform: uppercase; }
    td.amount, th.amount { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    tr:last-child td { border-bottom: 0; }
    .empty { color: var(--muted); padding: 22px 8px; text-align: center; }
    footer { color: var(--muted); font-size: .8rem; padding: 8px 2px 24px; }
    @media (max-width: 720px) {
      main { margin-top: 20px; }
      header { display: block; }
      .meta { text-align: left; margin-top: 10px; }
      .cards { grid-template-columns: 1fr; }
      .grid { grid-template-columns: 1fr; }
    }
    @media print {
      body { background: #fff; }
      main { width: 100%; margin: 0; }
      .card, section { box-shadow: none; break-inside: avoid; }
      header { margin-top: 0; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">Báo cáo tài chính cá nhân</p>
        <h1>{{REPORT_TITLE}}</h1>
        <p class="muted">Kỳ báo cáo: {{PERIOD_LABEL}}</p>
      </div>
      <div class="meta">
        <div>Các loại tiền: {{CURRENCY_LABEL}}</div>
        <div>Ngày tạo: {{GENERATED_AT}}</div>
      </div>
    </header>

    {{CURRENCY_SECTIONS}}

    <footer>Dữ liệu được tổng hợp từ các giao dịch đã lưu. Chênh lệch được tính bằng tổng thu trừ tổng chi; không quy đổi giữa các loại tiền tệ.</footer>
  </main>
</body>
</html>
